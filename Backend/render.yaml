services:
  - type: web
    name: tech-oracle-api
    env: python
    region: oregon  # Choose: oregon, frankfurt, singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_DB_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false  # Generate: openssl rand -hex 32
      - key: TECHNICIAN_PASSWORD
        sync: false  # Your secure password
      - key: GROQ_API_KEY
        sync: false  # From console.groq.com
      - key: DB_NAME
        value: tech-oracle
      - key: COLLECTION_NAME
        value: repair_records
      - key: FRONTEND_URL
        sync: false  # Your Vercel URL
      - key: USE_GROQ
        value: true  # Use Groq instead of Ollama in production
      - key: SMTP_HOST
        sync: false  # e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false  # SMTP login email
      - key: SMTP_PASSWORD
        sync: false  # App password / SMTP password
      - key: SMTP_FROM_EMAIL
        sync: false  # Sender email
      - key: SMTP_USE_TLS
        value: true
      - key: SMTP_TIMEOUT_SECONDS
        value: 20
